<!doctype html>
<html lang="nl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oude colleges importeren — StudyGrasp</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background:#090d14; color:#eef3ff; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; box-sizing:border-box; }
    main { width:min(620px,100%); background:#121925; border:1px solid #2a3548; border-radius:20px; padding:28px; box-sizing:border-box; box-shadow:0 24px 80px #0008; }
    h1 { margin:0 0 10px; font-size:26px; } p { color:#aebbd0; line-height:1.55; }
    .notice { background:#192235; border:1px solid #30415f; border-radius:12px; padding:14px; }
    input { display:block; width:100%; margin:20px 0; padding:14px; box-sizing:border-box; border:1px dashed #4c6389; border-radius:12px; background:#0c121c; }
    button,a.button { display:inline-flex; align-items:center; justify-content:center; border:0; border-radius:11px; padding:12px 18px; font-weight:700; text-decoration:none; cursor:pointer; }
    button { background:#6698ff; color:#07101f; } button:disabled { opacity:.45; cursor:not-allowed; }
    a.button { background:#202a3a; color:#eaf1ff; margin-left:8px; }
    progress { width:100%; height:12px; margin:18px 0 8px; accent-color:#6698ff; }
    #status { min-height:28px; color:#c9d5e8; } .error { color:#ff8e8e!important; } .success { color:#74dfa2!important; }
  </style>
</head>
<body>
<main>
  <h1>Oude colleges importeren</h1>
  <p class="notice">Alleen het ingelogde eigenaaraccount kan deze back-up importeren. Accounts, wachtwoorden en API-sleutels zitten niet in het bestand.</p>
  <p>Selecteer <strong>StudyGrasp-migratie.zip</strong>. Sluit dit venster niet tijdens het uploaden.</p>
  <input id="backup" type="file" accept=".zip,application/zip">
  <button id="start" disabled>Importeren</button>
  <a class="button" href="/">Annuleren</a>
  <progress id="progress" max="100" value="0" hidden></progress>
  <p id="status"></p>
</main>
<script type="module" src="/js/migration.js"></script>
</body>
</html>
